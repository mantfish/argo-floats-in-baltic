name: Run leaderboard pipeline

on:
  schedule:
    # 4h after each FCOO run is published (~04:00/~16:00 UTC), not 30 min
    # after -- data.fcoo.dk was observed to time out/refuse connections far
    # more often right after publish, presumably its own busiest window
    # (every other consumer chasing the same fresh file). See
    # data_handler.py's _FCOO_LOAD_MAX_RETRIES docstring for the retry
    # policy that absorbs whatever intermittent failures remain even at
    # this later offset.
    - cron: '0 8 * * *'   # ~08:00 UTC -- 4h after the 00Z FCOO run is published
    - cron: '0 20 * * *'  # ~20:00 UTC -- 4h after the 12Z FCOO run is published
  workflow_dispatch: {}     # lets you trigger a run manually from the Actions tab

# Serialize runs -- each run fully recomputes data/store/*.parquet and
# docs/data/*.json from scratch (not an incremental diff) and commits the
# whole thing. Two runs overlapping (e.g. a manual workflow_dispatch while
# a scheduled run is still mid-flight) each build a diverging full snapshot
# and race to push; the loser's `git pull --rebase` can't reconcile it since
# parquet is binary (unmergeable) and the JSON is a full rewrite, not an
# append -- confirmed live 2026-08-12 (two ~80-min-apart runs conflicted on
# every changed file). cancel-in-progress: false queues a newly-triggered
# run behind the current one instead of racing or killing it mid-pipeline.
concurrency:
  group: run-pipeline
  cancel-in-progress: false

permissions:
  contents: write   # required so this workflow can commit + push results back

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false   # LFS pulled selectively below to avoid bandwidth charges

      - name: Cache D6 bathymetry (LFS file, 255 MB -- only pull on cache miss)
        id: cache-bathy
        uses: actions/cache@v4
        with:
          path: data/store/D6_2024.nc
          key: bathy-D6-2024-v1

      - name: Pull bathymetry from LFS
        if: steps.cache-bathy.outputs.cache-hit != 'true'
        run: git lfs pull --include="data/store/D6_2024.nc"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install Python + dependencies
        run: |
          uv python install 3.12
          uv sync --frozen

      - name: Run pipeline
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_PASSWORD }}
        run: uv run main.py

      - name: Notify EKF piloting server of surfacings
        env:
          EKF_API_BASE_URL: ${{ vars.EKF_API_BASE_URL }}
        run: uv run scripts/notify_ekf_server.py

      - name: Commit updated state + exported JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/store docs/data
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "Update leaderboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git pull --rebase origin main
          git push
